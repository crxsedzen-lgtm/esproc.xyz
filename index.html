/* Starfall Canvas Background */

#top-volume-btn {

    width: 22px;
    height: 22px;

    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    opacity: 0.85;
}

#top-volume-btn:hover {
    transform: scale(1.15);
    opacity: 1;
}

#top-volume-btn svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
}

.slider-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

#top-volume-slider {
    appearance: none;
    -webkit-appearance: none;
    width: 90px;
    height: 5px;
    outline: none;
    cursor: pointer;
    border-radius: 99px;
    background: linear-gradient(to right, #ffffff var(--progress, 50%), rgba(255, 255, 255, 0.15) var(--progress, 50%));
    transition: height 0.2s ease;
}

#top-volume-slider:hover {
    height: 7px;
}

#top-volume-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;

.volume-badge {

/* CLICK TO ENTER SCREEN */
#enter-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
}

#enter-screen::before {
    content: "";
    position: absolute;
    width: 520px;
    height: 520px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.07);
    border-radius: 50%;
    filter: blur(170px);
    animation: enterGlow 5s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes enterGlow {
    from {
        opacity: 0.25;
        transform: translate(-50%, -50%) scale(0.8);
    }
    to {
        opacity: 0.65;
        transform: translate(-50%, -50%) scale(1.15);
    }
}

.enter-content {
    position: relative;
    z-index: 2;
    width: min(430px, 80vw);
    text-align: center;
    cursor: pointer;
    animation: enterFloat 4s ease-in-out infinite;
}

.enter-logo-img-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 10px;
    overflow: hidden;
    border-radius: 16px;
}

.enter-logo-img {
    display: block;
    width: clamp(160px, 22vw, 260px);
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.35));
}

.enter-logo-img-wrapper::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -150%;
    width: 60%;
    height: 200%;
    background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 30%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(255, 255, 255, 0.08) 70%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(25deg);
    animation: slitMove 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
}

@keyframes slitMove {
    0% { left: -150%; }
    38% { left: 180%; }
    100% { left: 180%; }
}

.enter-logo {

/* MAIN WEBSITE */

/* PROFILES GRID */
.profiles {

.profile {

    position: relative;
    width: 100%;
    min-height: 238px;

    border: 1px solid rgba(255,255,255,.105);
    border-radius: 18px;
    box-shadow:
        0 18px 45px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.045);

    text-align: left;
    transform: translateY(0) scale(1);
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        border-color .35s ease,
        box-shadow .35s ease;
}

.profile::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        radial-gradient(circle at 88% 0%, rgba(var(--accent-rgb), .19), transparent 35%),
        radial-gradient(circle at 10% 100%, rgba(255,255,255,.045), transparent 34%);

    border-radius: 18px;
}

.profile::after {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    right: 8%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.22),
        rgba(var(--accent-rgb), .7),
        transparent
    );

}

.profile:hover {

    border-color: rgba(var(--accent-rgb), .42);
    box-shadow:
        0 25px 65px rgba(0,0,0,.58),
        0 0 35px rgba(var(--accent-rgb), .075),
        inset 0 1px 0 rgba(255,255,255,.075);
}

.profile.loading {

}

.lanyard-banner {

.lanyard-banner-image {

.lanyard-card-body {

}

.lanyard-user {

}

.lanyard-avatar-wrap {

}

/* TOP STATUS SPEECH BUBBLE */
.status-speech-bubble {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 18, 22, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    padding: 3px 8px;
    font-size: 10px;

    z-index: 10;

}

.status-speech-bubble::after {

    height: 7px;
    background: rgba(18, 18, 22, 0.92);
    border-right: 1px solid rgba(255, 255, 255, 0.18);
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
}

.lanyard-avatar {

    background: #171719;

    box-shadow:
        0 5px 18px rgba(0,0,0,.55),

}

.profile:hover .lanyard-avatar {

}

.status-dot {
    position: absolute;

    border: 4px solid #171719;
    background: #747f8d;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08);
}

.status-dot.online { background: #23a559; box-shadow: 0 0 13px rgba(35,165,89,.55); }
.status-dot.idle { background: #f0b232; box-shadow: 0 0 13px rgba(240,178,50,.45); }
.status-dot.dnd { background: #f23f43; box-shadow: 0 0 13px rgba(242,63,67,.45); }
.status-dot.offline { background: #747f8d; }

.lanyard-identity {
    min-width: 0;
    padding-bottom: 6px;

}

.lanyard-name-row {
    display: flex;

.lanyard-name {

}

.lanyard-tag {

.lanyard-status {

    margin-top: 16px;
    padding: 12px 12px 11px;
    border-radius: 12px;
    background: rgba(0,0,0,.20);
    border: 1px solid rgba(255,255,255,.065);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
}

.lanyard-status-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
}

.lanyard-status-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #bfc1c5;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.lanyard-status-label::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(var(--accent-rgb),.65);
}

.lanyard-activity {
    color: #fff;
    font-size: 12px;
    line-height: 17px;
    min-height: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lanyard-activity strong {
    color: #fff;
    font-weight: 700;
}

.lanyard-activity-sub {
    margin-top: 2px;
    color: #85888e;
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lanyard-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 11px;
}

.lanyard-id {
    min-width: 0;
    color: #64676d;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

.lanyard-profile-link {
    flex: 0 0 auto;

    align-items: center;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.075);

}

}

.lanyard-profile-link:hover {
    color: #fff;
    background: rgba(255,255,255,.10);
    border-color: rgba(255,255,255,.16);
    transform: translateY(-1px);
}

.lanyard-loading,
.lanyard-error {
    width: 100%;
    min-height: 238px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #777;
    font-size: 12px;
    line-height: 18px;
}

.lanyard-loading strong { color: #bfc1c5; }
.lanyard-error { color: #ed7779; }

/* TICKER SECTION */
.avatar-ticker-section {
    width: 100%;
    margin: 45px 0 55px 0;
    position: relative;
    overflow: hidden;
}

.avatar-ticker-header-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 22px;
}

.avatar-ticker-header-line {
    height: 2px;
    width: 100px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25));
}

.avatar-ticker-header-line.right {

.avatar-ticker-header {
    text-align: center;
    font-family: Arial, sans-serif;

    letter-spacing: 6px;

.avatar-ticker-track {

    gap: 32px;

    width: max-content;
    will-change: transform;
    animation: avatarScrollInfinite 30s linear infinite;
}

.avatar-ticker-track:hover {
    animation-play-state: paused;
}

.avatar-item {
    position: relative;
    width: 68px;
    height: 68px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    outline: none;
}

.avatar-item-img-wrap {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.avatar-item-img-wrap::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
    z-index: 0;
    opacity: 0.6;
    transition: opacity 0.3s ease, inset 0.3s ease;
}

.avatar-item:hover .avatar-item-img-wrap::before {
    opacity: 1;
    inset: -4px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(88, 101, 242, 0.8));
    box-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
}

    position: relative;
    z-index: 1;
    width: 100%;

<script>
const music = document.getElementById("bgMusic");
const topVolumeBtn = document.getElementById("top-volume-btn");
const topVolumeSlider = document.getElementById("top-volume-slider");
const volumeBadge = document.getElementById("volume-percentage");
const volumeIcon = document.getElementById("volume-icon");

const icons = {
    mute: "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z",
    low: "M3 9v6h4l5 5V4L7 9H3zm10.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z",
    high: "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
};

music.volume = 0.5;

function paintVolumeRange(percent) {
    topVolumeSlider.style.setProperty("--progress", `${Math.max(0, Math.min(100, percent))}%`);
}

function updateVolumeUI() {
    const vol = music.muted ? 0 : music.volume;
    const percent = Math.round(vol * 100);
    
    topVolumeSlider.value = vol;
    paintVolumeRange(percent);
    volumeBadge.textContent = `${percent}%`;

    const path = volumeIcon.querySelector("path");
    if (music.muted || vol === 0) {
        path.setAttribute("d", icons.mute);
    } else if (vol < 0.5) {
        path.setAttribute("d", icons.low);
    } else {
        path.setAttribute("d", icons.high);
    }
}

topVolumeSlider.addEventListener("input", () => {
    music.muted = false;
    music.volume = Number(topVolumeSlider.value);
    updateVolumeUI();
});

topVolumeBtn.addEventListener("click", () => {
    music.muted = !music.muted;
    updateVolumeUI();
});

paintVolumeRange(50);

function getStatusClass(status) {
    if (status === "online") return "online";
    if (status === "idle") return "idle";
    if (status === "dnd") return "dnd";
    return "offline";
}

function getStatusText(status) {
    if (status === "online") return "Online";
    if (status === "idle") return "Idle";
    if (status === "dnd") return "Do Not Disturb";
    return "Offline";
}

function buildLanyardCard(card, data) {
    const user = data.discord_user || {};
    const avatar = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256`
        : `https://api.lanyard.rest/${user.id}.png`;

    const decoration =
        user.avatar_decoration_data ||
        (user.avatar_decoration ? { asset: user.avatar_decoration } : null);

    const decorationAsset =
        decoration && decoration.asset ? String(decoration.asset) : null;

    const decorationUrl = decorationAsset
        ? `https://cdn.discordapp.com/avatar-decoration-presets/${encodeURIComponent(decorationAsset)}.png?size=240`
        : null;

    const activity = (data.activities || []).find(a => a.type === 0);
    const customStatus = (data.activities || []).find(a => a.type === 4);
    const spotify = data.spotify;
    const status = data.discord_status || "offline";
    const displayName = user.global_name || user.username || "Unknown User";

    const statusColors = {
        online: ["35,165,89", "#23a559"],
        idle: ["240,178,50", "#f0b232"],
        dnd: ["242,63,67", "#f23f43"],
        offline: ["116,127,141", "#747f8d"]
    };

    const [rgb, solid] = statusColors[status] || statusColors.offline;
    card.style.setProperty("--accent-rgb", rgb);
    card.style.setProperty("--accent", solid);
    card.classList.remove("loading");

    let activityMain = "No current activity";
    let activitySub = "Currently not doing anything";

    if (spotify && data.listening_to_spotify) {
        activityMain = `Listening to <strong>${escapeHtml(spotify.song)}</strong>`;
        activitySub = `${escapeHtml(spotify.artist)}`;
    } else if (activity) {
        activityMain = escapeHtml(activity.name || "Activity");
        activitySub = escapeHtml(
            activity.details ||
            activity.state ||
            "Currently active"
        );
    }

    /* Extract Custom Status Message / Emoji for Speech Bubble */
    let bubbleText = "";
    if (customStatus) {
        if (customStatus.emoji && customStatus.emoji.name) {
            bubbleText += customStatus.emoji.name + " ";
        }
        if (customStatus.state) {
            bubbleText += customStatus.state;
        }
    }

    const statusText = getStatusText(status);

    const bannerUrl =
        `https://discord.tsunstudio.pw/api/banner/${encodeURIComponent(user.id)}/image`;

    const bannerMarkup = `
        <div class="lanyard-banner has-image">
            <img
                class="lanyard-banner-image"
                src="${bannerUrl}"
                alt=""
                aria-hidden="true"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.parentElement.classList.remove('has-image');
                    this.parentElement.classList.add('no-image');
                "
            >
        </div>
    `;

    card.innerHTML = `
        ${bannerMarkup}

        <div class="lanyard-card-body">
            <div class="lanyard-user">
                <div class="lanyard-avatar-wrap">
                    ${
                        bubbleText
                        ? `<div class="status-speech-bubble" title="${escapeHtml(bubbleText)}">${escapeHtml(bubbleText)}</div>`
                        : ""
                    }
                    <img
                        class="lanyard-avatar"
                        src="${avatar}"
                        alt="${escapeHtml(displayName)}"
                        loading="lazy"
                    >
                    ${
                        decorationUrl
                        ? `<img
                            class="avatar-decoration ${String(decorationAsset).startsWith("a_") ? "is-animated" : ""}"
                            src="${decorationUrl}"
                            alt=""
                            aria-hidden="true"
                            loading="lazy"
                            onerror="this.remove()"
                        >`
                        : ""
                    }
                    <span class="status-dot ${getStatusClass(status)}"></span>
                </div>

                <div class="lanyard-identity">
                    <div class="lanyard-name-row">
                        <div class="lanyard-name">${escapeHtml(displayName)}</div>
                    </div>
                    <div class="lanyard-tag">@${escapeHtml(user.username || "unknown")}</div>
                </div>
            </div>

            <div class="lanyard-status">
                <div class="lanyard-status-head">
                    <div class="lanyard-status-label">${escapeHtml(statusText)}</div>
                    <div class="lanyard-status-text"></div>
                </div>

                <div class="lanyard-activity">${activityMain}</div>
                <div class="lanyard-activity-sub">${activitySub}</div>
            </div>

            <div class="lanyard-footer">
                <div class="lanyard-id">ID · ${escapeHtml(user.id)}</div>

                <a
                    class="lanyard-profile-link"
                    href="https://discord.com/users/${encodeURIComponent(user.id)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Profile
                </a>
            </div>
        </div>
    `;
}

function buildAvatarItemHTML(data) {
    const user = data.discord_user || {};
    const avatar = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
        : `https://api.lanyard.rest/${user.id}.png`;

    const decoration =
        user.avatar_decoration_data ||
        (user.avatar_decoration ? { asset: user.avatar_decoration } : null);

    const decorationAsset = decoration && decoration.asset ? String(decoration.asset) : null;
    const decorationUrl = decorationAsset
        ? `https://cdn.discordapp.com/avatar-decoration-presets/${encodeURIComponent(decorationAsset)}.png?size=128`
        : null;

    const status = data.discord_status || "offline";
    const statusClass = getStatusClass(status);
    const displayName = user.global_name || user.username || "Member";
    const handle = user.username ? `@${user.username}` : "";

    return `
        <a class="avatar-item" href="https://discord.com/users/${encodeURIComponent(user.id)}" target="_blank" aria-label="${escapeHtml(displayName)}">
            <div class="avatar-item-tooltip">
                <span class="tooltip-name">${escapeHtml(displayName)}</span>
                <span class="tooltip-username">${escapeHtml(handle)}</span>
            </div>
            <div class="avatar-item-img-wrap">
                <img class="avatar-item-img" src="${avatar}" alt="${escapeHtml(user.username)}" loading="lazy">
            </div>
            ${
                decorationUrl
                ? `<img class="avatar-item-decor" src="${decorationUrl}" alt="" loading="lazy" onerror="this.remove()">`
                : ""
            }
            <span class="avatar-item-status ${statusClass}"></span>
        </a>
    `;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* Ticker User IDs */

const tickerUserIds = [
    "1416760740223647766",
    "1372253510833274930",
    "1276032551059849228",
    "1462584790929637399",
    "773846926474870814",
    "1350849152136773717",
    "1507653009386246221",
    "884532105902706718",
    "1252569047304896566",
    "1180525578374361108",
    "1250050030253903884",
    "1027014497740787835"
];

async function loadLanyardProfiles() {
    const cards = Array.from(document.querySelectorAll(".profile[data-user-id]"));

    cards.forEach(card => {
        card.classList.add("loading");
        card.innerHTML = `<div class="lanyard-loading"><strong>Connecting to Lanyard...</strong><span>Fetching live Discord presence</span></div>`;
    });

    const gridPromises = cards.map(async (card) => {
        const userId = card.dataset.userId.trim();
        if (!userId) return;

        try {
            const response = await fetch(
                `https://api.lanyard.rest/v1/users/${encodeURIComponent(userId)}`
            );
            const result = await response.json();

            if (!response.ok || !result.success || !result.data) {
                throw new Error("User is not being monitored by Lanyard.");
            }

            buildLanyardCard(card, result.data);
        } catch (error) {
            card.classList.add("loading");
            card.innerHTML = `
                <div class="lanyard-error">
                    Lanyard profile not found.
                    <span>Make sure this Discord ID belongs to someone in the Lanyard server.</span>
                </div>
            `;
        }
    });

    const tickerPromises = tickerUserIds.map(async (userId) => {
        try {
            const response = await fetch(
                `https://api.lanyard.rest/v1/users/${encodeURIComponent(userId)}`
            );
            const result = await response.json();
            if (response.ok && result.success && result.data) {
                return result.data;
            }
        } catch (err) {
            console.error(`Could not fetch ticker user ${userId}:`, err);
        }
        return null;
    });

    const [, tickerResults] = await Promise.all([
        Promise.all(gridPromises),
        Promise.all(tickerPromises)
    ]);

    const tickerDataList = tickerResults.filter(Boolean);

    if (tickerDataList.length > 0) {
        const track = document.getElementById("avatar-ticker-track");
        let itemsHTML = "";

        tickerDataList.forEach(data => {
            itemsHTML += buildAvatarItemHTML(data);
        });

        const repeatCount = Math.max(6, Math.ceil(16 / tickerDataList.length));
        track.innerHTML = itemsHTML.repeat(repeatCount);
    }
}

loadLanyardProfiles();

const enterScreen = document.getElementById("enter-screen");

enterScreen.addEventListener("click", (event) => {
    event.preventDefault();
    enterWebsite();
});

function enterWebsite() {
    music.volume = Number(topVolumeSlider.value);

    music.play().catch(error => {
        console.log("Music could not start automatically:", error);
    });

    enterScreen.style.opacity = "0";
    enterScreen.style.visibility = "hidden";

    setTimeout(() => {
        enterScreen.style.display = "none";
    }, 1000);
}
</script>

<script>
/* BACKGROUND STARFALL CANVAS */
(() => {
    const canvas = document.getElementById("starfall-canvas");
    if (!canvas) return;

    const ctx = canvas.getContext("2d");
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = 0;
    let height = 0;
    let stars = [];
    let meteors = [];
    let last = performance.now();
    let spawnTimer = 0;

    const rand = (min, max) => Math.random() * (max - min) + min;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.max(75, Math.min(170, Math.floor((width * height) / 11000)));
        stars = Array.from({ length: count }, () => ({
            x: rand(0, width),
            y: rand(0, height),
            r: rand(.35, 1.35),
            alpha: rand(.18, .75),
            twinkle: rand(0, Math.PI * 2),
            speed: rand(.45, 1.5)
        }));
    }

    function spawnMeteor() {
        const fromLeft = Math.random() < .72;
        const x = fromLeft ? rand(-80, width * .75) : rand(width * .2, width + 80);
        const y = rand(-100, height * .42);

        meteors.push({
            x,
            y,
            vx: rand(260, 520),
            vy: rand(210, 420),
            length: rand(55, 145),
            width: rand(.7, 1.6),
            life: 0,
            maxLife: rand(.65, 1.25),
            alpha: rand(.35, .9)
        });
    }

    function drawStars(time) {
        for (const s of stars) {
            const twinkle = .72 + Math.sin(time * 0.001 * s.speed + s.twinkle) * .28;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${Math.max(.08, s.alpha * twinkle)})`;
            ctx.fill();
        }
    }

    function drawMeteors(dt) {
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.life += dt;
            m.x += m.vx * dt;
            m.y += m.vy * dt;

            const progress = m.life / m.maxLife;
            const fade = Math.sin(Math.min(1, progress) * Math.PI);

            const speed = Math.hypot(m.vx, m.vy);
            const ux = m.vx / speed;
            const uy = m.vy / speed;

            const tailX = m.x - ux * m.length;
            const tailY = m.y - uy * m.length;

            const gradient = ctx.createLinearGradient(
                tailX, tailY, m.x, m.y
            );
            gradient.addColorStop(0, "rgba(255,255,255,0)");
            gradient.addColorStop(.65, `rgba(235,240,255,${m.alpha * fade * .28})`);
            gradient.addColorStop(1, `rgba(255,255,255,${m.alpha * fade})`);

            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(m.x, m.y);
            ctx.lineWidth = m.width;
            ctx.strokeStyle = gradient;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 1.35, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${m.alpha * fade})`;
            ctx.fill();

            if (
                m.life > m.maxLife ||
                m.x > width + 180 ||
                m.y > height + 180
            ) {
                meteors.splice(i, 1);
            }
        }
    }

    function animate(now) {
        const dt = Math.min((now - last) / 1000, .04);
        last = now;

        ctx.clearRect(0, 0, width, height);

        const bg = ctx.createRadialGradient(
            width * .5, height * .35, 0,
            width * .5, height * .35, Math.max(width, height) * .72
        );
        bg.addColorStop(0, "rgba(20,20,25,.10)");
        bg.addColorStop(.55, "rgba(0,0,0,0)");
        bg.addColorStop(1, "rgba(0,0,0,.22)");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        drawStars(now);
        drawMeteors(dt);

        spawnTimer += dt;
        if (spawnTimer > rand(1.4, 3.2)) {
            spawnMeteor();
            spawnTimer = 0;
        }

        requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize, { passive: true });
    resize();

    spawnMeteor();
    requestAnimationFrame(animate);
})();
</script>
</body>
